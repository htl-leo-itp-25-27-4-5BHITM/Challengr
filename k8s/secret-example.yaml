apiVersion: v1
kind: Secret
metadata:
  name: challengr-secrets
  namespace: student-it220257
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  # Nur Platzhalter! Echte Werte: lang und zufällig (z. B. openssl rand -base64 32)
  POSTGRES_PASSWORD: <replace-with-strong-random-password>
  KEYCLOAK_ADMIN_PASSWORD: <replace-with-strong-random-password>
  KEYCLOAK_CLIENT_SECRET: <replace-with-keycloak-client-secret>
  KEYCLOAK_ADMIN_CLIENT_ID: challengr-admin-api
  KEYCLOAK_ADMIN_CLIENT_SECRET: <replace-with-admin-api-client-secret>
