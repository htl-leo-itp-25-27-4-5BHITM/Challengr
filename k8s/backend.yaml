apiVersion: apps/v1
kind: Deployment
metadata:
  name: challengr-backend
  namespace: student-it220257
spec:
  replicas: 1
  selector:
    matchLabels:
      app: challengr-backend
  template:
    metadata:
      labels:
        app: challengr-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/challengr-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://challengr-postgres-service:5432/postgres
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: challengr-secrets
                  key: POSTGRES_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: challengr-secrets
                  key: POSTGRES_PASSWORD
            - name: QUARKUS_CORS_ORIGINS
              value: https://it220257.cloud.htl-leonding.ac.at,http://localhost:4200,http://127.0.0.1:4200
            - name: KEYCLOAK_URL
              value: https://it220257.cloud.htl-leonding.ac.at/auth
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: challengr-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: challengr-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_ID
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: challengr-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            # TestFlight-Feedback im Dashboard (optional – ohne Secret ist die Funktion aus)
            - name: ASC_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  name: challengr-asc
                  key: ASC_ISSUER_ID
                  optional: true
            - name: ASC_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: challengr-asc
                  key: ASC_KEY_ID
                  optional: true
            - name: ASC_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: challengr-asc
                  key: ASC_PRIVATE_KEY
                  optional: true
          # Datenbank-Backups (Dashboard → System), eigenes Volume
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: challengr-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: challengr-backup-pvc
  namespace: student-it220257
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: challengr-backend-service
  namespace: student-it220257
spec:
  selector:
    app: challengr-backend
  ports:
    - port: 8080
      targetPort: 8080
