apiVersion: apps/v1
kind: Deployment
metadata:
  name: challengr-webapp
  namespace: student-it220257
spec:
  # TestFlight-Phase: WebApp abgeschaltet. Sie schickt noch keinen Keycloak-Login mit und würde
  # seit Checkliste A2–A4 nicht mehr funktionieren. Schüler nutzen die iPhone-App.
  # Wieder aktivieren erst, wenn map.js/GameSocketClient.js ein Token mitschicken.
  replicas: 0
  selector:
    matchLabels:
      app: challengr-webapp
  template:
    metadata:
      labels:
        app: challengr-webapp
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: webapp
          image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/challengr-webapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: challengr-webapp-service
  namespace: student-it220257
spec:
  selector:
    app: challengr-webapp
  ports:
    - port: 80
      targetPort: 80
