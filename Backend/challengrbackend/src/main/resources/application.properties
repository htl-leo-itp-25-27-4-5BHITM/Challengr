quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
quarkus.datasource.db-kind=postgresql

# Dev/Test: Datenbank bei jedem Start neu, Stammdaten + Demo-Spieler laden
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=reference-data.sql,import.sql
# Prod: NIE löschen. Schema nur ergänzen; Stammdaten legt ReferenceDataSeeder an, falls sie fehlen.
%prod.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.challengr.seed-reference-data=true

quarkus.http.cors.enabled=true
# Kein "*" (zusammen mit allow-credentials unsicher); in Prod setzt k8s die echten Origins
quarkus.http.cors.origins=${QUARKUS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# Keycloak / OIDC
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:9090}/realms/challengr
quarkus.oidc.client-id=challengr-backend
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:secret}
quarkus.oidc.application-type=service

# Keycloak Admin API (for banning users)
challengr.keycloak.admin.realm=${KEYCLOAK_REALM:challengr}
challengr.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
challengr.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

quarkus.rest-client.keycloak-token.url=${KEYCLOAK_URL:http://localhost:9090}
quarkus.rest-client.keycloak-admin.url=${KEYCLOAK_URL:http://localhost:9090}

# Prod: keine Standard-Passwörter – fehlt ein Secret, startet der Server nicht
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
%prod.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
# ProdSecretsGuard: ohne Umgebungsvariablen schlägt schon die Konfigurationsprüfung fehl
challengr.guard.keycloak-client-secret=dev-only
challengr.guard.datasource-password=dev-only
%prod.challengr.guard.enabled=true
# B1: in Prod wird beim Konto-Löschen immer auch das Keycloak-Konto gelöscht
%prod.challengr.account-deletion.require-keycloak=true
%prod.challengr.guard.keycloak-client-secret=${KEYCLOAK_CLIENT_SECRET}
%prod.challengr.guard.datasource-password=${QUARKUS_DATASOURCE_PASSWORD}

# Login: Spieler-ID = Claim "sub" des Keycloak-Tokens, Rollen aus realm_access/roles
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.roles.role-claim-path=realm_access/roles
# WebSocket nur mit Login (Token wird beim HTTP-Upgrade geprüft)
quarkus.http.auth.permission.ws.paths=/ws/*
quarkus.http.auth.permission.ws.policy=authenticated

# Dev/Test/Harness ohne Keycloak: X-Player-Id-Header als Login (in Prod verboten, siehe ProdSecretsGuard)
challengr.auth.trust-player-header=false
%dev.challengr.auth.trust-player-header=true
%test.challengr.auth.trust-player-header=true

# In Dev-Mode: OIDC deaktivieren (optional, zum Testen ohne Keycloak)
%dev.quarkus.oidc.enabled=false

# Test profile: no Keycloak required, use in-memory DB
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:challengr;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=reference-data.sql,import.sql


# TestFlight-Feedback im Dashboard (App Store Connect API). Ohne Werte ist die Funktion aus.
# In Prod aus dem Kubernetes-Secret challengr-asc (scripts/setup-appstore-api.sh).
challengr.asc.issuer-id=${ASC_ISSUER_ID:}
challengr.asc.key-id=${ASC_KEY_ID:}
challengr.asc.private-key=${ASC_PRIVATE_KEY:}

# Check-in-Punkte aus OpenStreetMap (Tests ohne Netz)
%test.challengr.landmarks.enabled=false
%dev.challengr.landmarks.enabled=false

# Backups (pg_dump im Server-Image, Volume /backups)
%test.challengr.backup.dir=target/test-backups
%dev.challengr.backup.dir=target/dev-backups
%test.challengr.status.external-checks=false
%dev.challengr.status.external-checks=false

# Systemstatus im Dashboard: Login-Server prüfen
challengr.status.keycloak-url=${KEYCLOAK_URL:http://localhost:9090}/realms/challengr/.well-known/openid-configuration
