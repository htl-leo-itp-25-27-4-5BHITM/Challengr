name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/challengrbackend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: Backend/challengrbackend/pom.xml
      - name: Tests
        run: ./mvnw -B test

  dashboard:
    name: Dashboard (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci
      - name: Build
        run: npx ng build
